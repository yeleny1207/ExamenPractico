<header class="app-header">

      <i class="fas fa-server logo-icon"></i>

    </div>
   
    <div class="badge-indicador">
      <i class="fas fa-microchip"></i>
      <span>Equipos registrados: <strong>{{ totalEquipos }}</strong></span>
    </div>
  </div>
</header>

<main class="main-container">

    <a routerLink="/buscar" routerLinkActive="active" class="btn-menu">
      <i class="fas fa-search"></i> Buscar
    </a>

    </a>
    <a routerLink="/mostrar" routerLinkActive="active" class="btn-menu">
      <i class="fas fa-eye"></i> Mostrar
    </a>

  <section class="content-card">

</main>

<footer class="app-footer">
  <p><i class="fas fa-shield-alt"></i> Sistema de Control Tecnológico &copy; 2026 </p>
